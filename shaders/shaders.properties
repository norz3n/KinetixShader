# ====================================================================
# AstraCHS 1.21.1 - High-Performance Contact-Hardening Shader
# Compatible with Iris, Oculus, NeOculus & Embeddium (Minecraft 1.21.1)
# Optimized for Intel UHD 620 / 630 & Low-Bandwidth Integrated GPUs
# ====================================================================

# --- Ultra-Narrow G-Buffer Formats (Bandwidth Optimization for UHD 620/630) ---
colortex0Format=R11F_G11F_B10F
colortex1Format=RGBA8
colortex2Format=RGBA8

colortex0Clear=true
colortex1Clear=true
colortex2Clear=true
colortex0ClearColor=0.0 0.0 0.0 1.0
colortex1ClearColor=0.5 0.5 0.0 1.0
colortex2ClearColor=0.95 1.0 0.0 1.0

# Disable alpha blending on normal/material attachments in translucent passes
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_hand.colortex1=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured.colortex1=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
blend.gbuffers_clouds.colortex1=off
blend.gbuffers_clouds.colortex2=off

# Shadow configuration
shadowMapResolution=1024
shadowDistance=64.0
shadowDistanceRenderMul=1.0
shadowIntervalSize=2.0
generateShadowMipmap=false
generateShadowColorMipmap=false
shadowHardwareFiltering0=false
shadowHardwareFiltering1=false
shadowtex0Nearest=false
shadowtex1Nearest=false
shadowcolor0Nearest=false

# Sunlight path rotation (tilted so shadows have natural angle at noon)
sunPathRotation=-28.0

# Ambient occlusion & vanilla features
ambientOcclusionLevel=0.85
separateAo=true
oldHandLight=true
oldLighting=false
underwaterOverlay=true
vignette=false

# --- Profiles ---
profile.IGPU_UHD620=SHADOW_QUALITY=1 shadowMapResolution=768 shadowDistance=48.0 PCSS_ENABLED=true PCSS_BLOCKER_SAMPLES=4 PCSS_PCF_SAMPLES=6 COLORED_SHADOWS=false WAVING_ALL=true WAVING_TERRAIN=true WAVING_CROPS=true WAVING_VINES=true WAVING_UNDERWATER=true WAVING_LANTERNS=true WAVING_WATER=true WAVING_WEATHER=true WATER_SSR=false WATER_CAUSTICS=true GODRAYS=false BLOOM_ENABLED=true CAS_SHARPEN=true
profile.IGPU_BALANCED=SHADOW_QUALITY=2 shadowMapResolution=1024 shadowDistance=64.0 PCSS_ENABLED=true PCSS_BLOCKER_SAMPLES=4 PCSS_PCF_SAMPLES=8 COLORED_SHADOWS=true WAVING_ALL=true WAVING_TERRAIN=true WAVING_CROPS=true WAVING_VINES=true WAVING_UNDERWATER=true WAVING_LANTERNS=true WAVING_WATER=true WAVING_WEATHER=true WATER_SSR=true WATER_CAUSTICS=true GODRAYS=true BLOOM_ENABLED=true CAS_SHARPEN=true
profile.DEDICATED_HIGH=SHADOW_QUALITY=3 shadowMapResolution=2048 shadowDistance=96.0 PCSS_ENABLED=true PCSS_BLOCKER_SAMPLES=6 PCSS_PCF_SAMPLES=12 COLORED_SHADOWS=true WAVING_ALL=true WAVING_TERRAIN=true WAVING_CROPS=true WAVING_VINES=true WAVING_UNDERWATER=true WAVING_LANTERNS=true WAVING_WATER=true WAVING_WEATHER=true WATER_SSR=true WATER_CAUSTICS=true GODRAYS=true BLOOM_ENABLED=true CAS_SHARPEN=true
profile.SHADOWLESS_TURBO=SHADOW_QUALITY=0 shadowMapResolution=512 shadowDistance=16.0 PCSS_ENABLED=false PCSS_BLOCKER_SAMPLES=2 PCSS_PCF_SAMPLES=4 COLORED_SHADOWS=false WAVING_ALL=true WAVING_TERRAIN=true WAVING_CROPS=true WAVING_VINES=true WAVING_UNDERWATER=true WAVING_LANTERNS=true WAVING_WATER=true WAVING_WEATHER=true WATER_SSR=false WATER_CAUSTICS=false GODRAYS=false BLOOM_ENABLED=false CAS_SHARPEN=true

# --- GUI Screen Layout ---
screen=[SHADOW_SCREEN] [WAVING_SCREEN] [ATMOS_WATER_SCREEN] [POST_SCREEN] *
screen.SHADOW_SCREEN=SHADOW_QUALITY shadowMapResolution shadowDistance PCSS_ENABLED PCSS_SOFTNESS PCSS_CONTACT_SHARPNESS PCSS_BLOCKER_SAMPLES PCSS_PCF_SAMPLES COLORED_SHADOWS
screen.WAVING_SCREEN=WAVING_ALL WAVING_TERRAIN WAVING_CROPS WAVING_VINES WAVING_UNDERWATER WAVING_LANTERNS WAVING_WATER WAVING_WEATHER WIND_SPEED WIND_STRENGTH
screen.ATMOS_WATER_SCREEN=WATER_SSR WATER_CAUSTICS WATER_WAVES WATER_FOAM_OPACITY GODRAYS FOG_DENSITY DYNAMIC_HANDLIGHT FLICKER_TORCH FOLIAGE_SSS
screen.POST_SCREEN=TONEMAP_OPERATOR BLOOM_ENABLED BLOOM_STRENGTH CAS_SHARPEN CAS_STRENGTH VIBRANCE
